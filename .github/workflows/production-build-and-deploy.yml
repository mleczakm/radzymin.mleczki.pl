name: Production Build and Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOMAIN: radzymin.mleczki.pl

jobs:
  build-and-deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Generate date-based version
        id: version
        env:
          TZ: Europe/Warsaw
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version="$(date +'%Y%m%d%H%M')"
          if git ls-remote --exit-code origin "refs/tags/$version" >/dev/null 2>&1; then
            version="$(date +'%Y%m%d%H%M%S')"
          fi
          if git ls-remote --exit-code origin "refs/tags/$version" >/dev/null 2>&1; then
            version="${version}-${TESTED_SHA:0:7}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Validate production secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MIKRUS_SSH_HOST: ${{ secrets.MIKRUS_SSH_HOST }}
          MIKRUS_SSH_PORT: ${{ secrets.MIKRUS_SSH_PORT }}
          MIKRUS_IPV6: ${{ secrets.MIKRUS_IPV6 }}
          CYTRUS_IPV4: ${{ secrets.CYTRUS_IPV4 }}
          CYTRUS_API_TOKEN: ${{ secrets.CYTRUS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          for name in SSH_PRIVATE_KEY MIKRUS_SSH_HOST MIKRUS_SSH_PORT MIKRUS_IPV6 \
            CYTRUS_IPV4 CYTRUS_API_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID DOTENV; do
            if [[ -z "${!name}" ]]; then
              echo "Missing production secret: $name" >&2
              exit 1
            fi
          done
          for name in APP_SECRET ADMIN_USER ADMIN_PASSWORD_HASH; do
            if ! grep -Eq "^${name}=.+$" <<< "$DOTENV"; then
              echo "DOTENV is missing required variable: $name" >&2
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/php/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.title=Radzymińskie Petycje
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Set up Node for Cloudflare CLI
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Cloudflare CLI
        run: |
          npm install --global cf@1.0.0-beta.12
          cf --version

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Create .env file
        # The secret goes through an env var, not inline in the script: a bcrypt ADMIN_PASSWORD_HASH
        # contains "$" characters that bash would otherwise expand and silently corrupt.
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          printf '%s\n' "$DOTENV" > .env.production
          echo "ENV_FILE_PATH=$(pwd)/.env.production" >> "$GITHUB_ENV"

      - name: Deploy to Mikrus
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbooks/deploy.yml \
            --extra-vars "app_version=${{ steps.version.outputs.value }} cytrus_host=${{ secrets.CYTRUS_IPV4 }}" \
            --extra-vars "cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --extra-vars "cloudflare_zone_id=${{ secrets.CLOUDFLARE_ZONE_ID }}" \
            --extra-vars "cytrus_api_token=${{ secrets.CYTRUS_API_TOKEN }}" \
            --extra-vars "ansible_host=${{ secrets.MIKRUS_SSH_HOST }} mikrus_ipv6=${{ secrets.MIKRUS_IPV6 }}" \
            --extra-vars "ansible_port=${{ secrets.MIKRUS_SSH_PORT }}" \
            --extra-vars "github_actor=${{ github.actor }} github_token=${{ secrets.GITHUB_TOKEN }}" \
            --extra-vars "env_file_path=${{ env.ENV_FILE_PATH }}" \
            --extra-vars "domain=${{ env.DOMAIN }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          ANSIBLE_ROLES_PATH: ./ansible/roles

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TESTED_SHA" \
            --title "Release $VERSION" \
            --notes "Automated release after successful QA and production deployment."
