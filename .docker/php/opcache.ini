; Production only. Swoole runs in the CLI SAPI, where OPcache is off by default; without it every
; request re-reads and recompiles the PHP templates. Measured for this app: +30-65% requests/s for
; about +3 MiB of RAM. All app and vendor code the site loads compiles to ~3.2 MiB (116 scripts,
; ~1.2 MiB of interned strings), so these sizes leave ~2.5x headroom. If the cache ever fills up,
; OPcache just stops caching new scripts, nothing breaks.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=8
opcache.interned_strings_buffer=2
opcache.max_accelerated_files=1000
; The image is immutable: code changes only with a new deploy (new container), so skip the stat() calls.
opcache.validate_timestamps=0
opcache.jit=disable
