services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MAILER_DSN: smtp://mailpit:1025
      DB_PATH: /app/db/data.sqlite
    volumes:
      - .:/app
      # SQLite lives in its own named volume, not the bind mount above: SQLite writes can
      # fail with "disk I/O error" over some hosts' FUSE/virtiofs-backed bind mounts.
      - db-data:/app/db
      - composer-cache:/tmp/composer-cache
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8026:8025"

volumes:
  composer-cache:
  db-data:
